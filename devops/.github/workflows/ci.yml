name: MedQR Continuous Integration (CI) Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Code Linter & Formatting Checks
        run: npm run lint --if-present

      - name: Execute Automated Unit & Integration Tests
        run: npm test --if-present
        env:
          CI: true
          NODE_ENV: test

      - name: Build Application Artifacts
        run: npm run build --if-present

  terraform-check:
    name: Validate Terraform Infrastructure Code (IaC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Verification
        run: terraform fmt -check -recursive devops/terraform

      - name: Terraform Initialization & Validation
        run: |
          cd devops/terraform
          terraform init -backend=false
          terraform validate
