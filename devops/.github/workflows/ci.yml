name: MedQR Continuous Integration (CI) Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Project Dependencies
        working-directory: devops
        run: npm install

      - name: Run Code Linter & Formatting Checks
        working-directory: devops
        run: npm run lint --if-present

      - name: Execute Automated Unit & Integration Tests
        working-directory: devops
        run: npm test
        env:
          CI: true
          NODE_ENV: test

      - name: Build Application Artifacts
        working-directory: devops
        run: npm run build --if-present

  terraform-check:
    name: Validate Terraform Infrastructure Code (IaC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Format Verification
        run: terraform fmt -check -recursive devops/terraform

      - name: Terraform Init
        working-directory: devops/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: devops/terraform
        run: terraform validate -no-color
