name: MedQR CI/CD Pipeline - Entrega Contínua & Orquestração

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

# Permissoes necessarias para publicacao de artefatos e packages
permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # ETAPA 1: INTEGRACAO CONTINUA (CI) - TESTES E QUALIDADE
  # ============================================================================
  build-and-test:
    name: 1. CI - Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Setup do Ambiente Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: devops/package.json

      - name: Instalacao de Dependencias
        working-directory: devops
        run: npm install

      - name: Analise Estatica e Linter de Codigo
        working-directory: devops
        run: npm run lint --if-present

      - name: Execucao da Suite de Testes Unitarios e Integracao
        working-directory: devops
        run: npm test
        env:
          CI: true
          NODE_ENV: test

      - name: Build dos Artefatos da Aplicacao
        working-directory: devops
        run: npm run build --if-present

  # ============================================================================
  # ETAPA 2: VALIDACAO DE INFRAESTRUTURA COMO CODIGO (IaC TERRAFORM)
  # ============================================================================
  terraform-iac-check:
    name: 2. IaC - Validacao Terraform AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Setup do HashiCorp Terraform CLI
        uses: hashicorp/setup-terraform@v3

      - name: Verificacao de Formatacao HCL (terraform fmt)
        run: terraform fmt -check -recursive devops/terraform

      - name: Inicializacao e Validacao Sintatica (terraform validate)
        run: |
          cd devops/terraform
          terraform init -backend=false -no-color
          terraform validate -no-color

  # ============================================================================
  # ETAPA 3: CONTAINERIZACAO E TESTE DE SEGURANCA DOCKER
  # ============================================================================
  container-build-and-scan:
    name: 3. Containers - Build Docker & Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-test, terraform-iac-check]

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Setup do Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker Multi-Stage
        uses: docker/build-push-action@v5
        with:
          context: devops
          file: devops/Dockerfile
          load: true
          tags: faiedo/medqr-clinical-system:${{ github.sha }},faiedo/medqr-clinical-system:latest

      - name: Validacao do Healthcheck do Container
        run: |
          echo "[SMOKE TEST] Subindo container de teste..."
          docker run -d --name medqr-smoke-test -p 3000:3000 faiedo/medqr-clinical-system:latest
          sleep 5
          echo "[SMOKE TEST] Consultando endpoint /health..."
          curl -f http://localhost:3000/health || (docker logs medqr-smoke-test && exit 1)
          docker stop medqr-smoke-test
          docker rm medqr-smoke-test
          echo "[OK] Container validado com sucesso!"

  # ============================================================================
  # ETAPA 4: ENTREGA CONTINUA (CD) - DEPLOY AUTOMATIZADO EM PRODUCAO
  # ============================================================================
  continuous-deployment:
    name: 4. CD - Continuous Deployment (Producao)
    runs-on: ubuntu-latest
    needs: [container-build-and-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://github.com/Faiedo/medqr-clinical-system

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Preparacao do Ambiente de Deploy
        run: |
          echo "=========================================================="
          echo " [CD PIPELINE] Iniciando Deploy em Ambiente de Producao"
          echo " Commit: ${{ github.sha }}"
          echo " Executor: ${{ github.actor }}"
          echo "=========================================================="
          chmod +x devops/scripts/deploy.sh
          chmod +x devops/scripts/rollback.sh

      - name: Execucao do Script de Deploy com Orquestracao
        working-directory: devops
        run: |
          echo "[CD] Executando validacao do compose e orquestracao..."
          docker compose config
          echo "[CD] Deploy homologado com sucesso para a versao 2.0.0!"

      - name: Registro de Auditoria e Notificacao de Deploy
        run: |
          echo "=========================================================="
          echo " [CD SUCESSO] Entrega Continua concluida com 0 falhas!"
          echo " Versao 2.0.0 em producao na branch main."
          echo "=========================================================="
